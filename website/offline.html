<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orby AI</title>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --gold: #d4a017;
    --gold-light: #f0c040;
    --text: #e8eaf0;
    --text-muted: #aab0bc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    max-width: 520px;
    text-align: center;
    background: var(--surface);
    border: 1px solid rgba(212,160,23,0.18);
    border-radius: 16px;
    padding: 48px 36px;
  }
  h1 {
    color: var(--gold-light);
    font-size: 1.7rem;
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }
  p { color: var(--text-muted); margin-bottom: 14px; font-size: 15px; }
  a { color: var(--gold-light); text-decoration: none; }
  a:hover { color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Orby AI is not taking signups right now</h1>
    <p>We're heads-down on the next version. Thanks for stopping by.</p>
    <p>If you'd like to be on the list when we open back up, email
       <a href="mailto:franklstreet@yahoo.com">franklstreet@yahoo.com</a>.</p>
  </div>
</body>
</html>
